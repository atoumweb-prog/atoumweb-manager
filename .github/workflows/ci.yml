name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - integration/ux-v2-lot09-05-compat-test-20261014
      - feature/ux-v2-lot09f-convergence-20261014
      - feature/ux-v2-lot09e-word-drafts-20261014
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-coherence
      - feature/prospect-workflow-v2
  pull_request:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - feature/prospect-workflow-v2

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --maxWorkers=2

      - name: Lot 05/09 — Contract Library native coexistence TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot05-09-native'
          New-Item -ItemType Directory -Force -Path $captures | Out-Null
          node scripts/check-contract-library-ui.cjs --output $captures --ux05b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath (Join-Path $captures 'controle-ui.json') -Raw | ConvertFrom-Json
          if ($report.errors.Count -ne 0 -or @($report.checks | Where-Object { -not $_.passed }).Count -ne 0) { throw '05B native test failed' }

      - name: Lot 05/09 — Unsaved contract library and clauses
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Lot 09F — Abby billing
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Expenses and receipts
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Documents and archive
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Word DOCX and PDF work
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Global UX 3x3
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Restore and quit
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' || github.ref == 'refs/heads/integration/ux-v2-lot09-05-compat-test-20261014') }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Lot 09E — True Word DOCX and contract drafts Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09E — General UX Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09E — Restore and quit Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lot 09A draft PR: native Electron in isolated TEMP fixtures only.
      - name: Lot 09A — Electron UI and SQLite Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 113 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09A — Restore and quit round-trip Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 113 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR98 standalone; the combined candidate runs this same recipe below.
      # La fixture crée exclusivement ses propres fichiers et profil dans %TEMP%.
      - name: Electron CRM 03B.6 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot03b6-native-captures'
          $log = Join-Path $env:RUNNER_TEMP 'lot03b6-native.log'
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot03b --captures $captures 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      # Stockage des artefacts saturé sur ce dépôt : conserver les preuves
      # textuelles et les empreintes dans les logs et le résumé GitHub.
      # Les PNG ne sont pas uploadés et la recette locale reste nécessaire
      # pour toute inspection visuelle humaine des captures.
      - name: Summarize Electron 03B.6 evidence
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        run: |
          $captureDir = Join-Path $env:RUNNER_TEMP 'lot03b6-native-captures'
          $captures = @(Get-ChildItem -LiteralPath $captureDir -Filter '*.png' -File | Sort-Object Name)
          if ($captures.Count -ne 9) { throw "Expected 9 PNG captures, found $($captures.Count)." }
          $log = Join-Path $env:RUNNER_TEMP 'lot03b6-native.log'
          $native = Get-Content -LiteralPath $log -Raw
          if ($native -notmatch 'PASSED ([0-9]+) real native assertions' -or $native -notmatch 'Fixture cleaned: true') {
            throw 'Native assertion summary or TEMP cleanup evidence missing.'
          }
          $checks = [regex]::Match($native, 'PASSED ([0-9]+) real native assertions').Groups[1].Value
          $lines = @(
            '## AtoumWeb 03B.6 — Real Windows/Electron recipe'
            ''
            '- True App + preload + IPC + SQLite TEMP'
            "- $checks native assertions passed; temporary fixture cleaned"
            '- 9 compositor-verified captures, 3 themes × 3 densities'
            '- Images are not uploaded: the Actions artifact storage quota is full'
            '- Manual visual inspection requires a local Windows run'
            ''
            '| Capture | SHA-256 |'
            '| --- | --- |'
          )
          foreach ($capture in $captures) {
            $sha = (Get-FileHash -LiteralPath $capture.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "| $($capture.Name) | $sha |"
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Write-Output

      - name: Electron combined 02C 02D 02E CRM and UX-01 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux-v2-02e-03c-v1' }}
        shell: pwsh
        run: |
          node scripts/check-ux-v2-integration-validate.cjs --native-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
