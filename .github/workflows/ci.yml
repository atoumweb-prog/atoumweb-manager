name: CI

on:
  push:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-prospects
  pull_request:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
