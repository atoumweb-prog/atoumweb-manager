name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ux-v2-lot09f-convergence-20261014
      - feature/ux-v2-lot09e-word-drafts-20261014
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-coherence
      - feature/prospect-workflow-v2
      - feature/ux-v2-lot08c-maintenance-refresh-guard-20261014
  pull_request:
    branches:
      - main
      - feature/ux-v2-lot04c-editor-drafts-v1
      - feature/ux-v2-lot04b-catalogue-navigation-v1
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - feature/prospect-workflow-v2

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Lot 04C: functional Electron editor checks, without visual-human signoff.
      - name: Electron Catalogue 04C — brouillons et conflits Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 108 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-identity-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lot 04D/04E: cross-cutting Catalogue UI and UX-01 checks on Windows TEMP.
      - name: Electron Catalogue 04D-04E — Windows TEMP et 9 captures contrôlées
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot04-consolide-native-captures'
          if (Test-Path $captures) { throw "Capture directory already exists" }
          node scripts/check-catalog-identity-ui.cjs --captures $captures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $images = @(Get-ChildItem -LiteralPath $captures -Filter '*.png' -File)
          if ($images.Count -ne 9) { throw "Expected 9 verified visual states, got $($images.Count)" }
          foreach ($file in $images) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "LOT04 VERIFIED FRAME $($file.Name) sha256=$hash bytes=$($file.Length)"
          }

      - name: Electron Recommandations 04D — interactions et UX-01 Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-recommendations-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Electron Aide commerciale 04E — clavier, Escape, focus Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-guidance-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Electron Prospect 04D — erreurs, reprise et suggestion volontaire
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-prospect-catalog-recommendations-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Electron Devis 04D — conseil et achat explicite Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-quote-catalog-recommendations-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native 04D — Electron IPC et SQLite TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-catalog-recommendations-native.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 Catalogue 04D-04E — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 Restauration et fermeture Electron 04D-04E — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX 05 integration ancestry gate
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        run: |
          if (Test-Path (git rev-parse --git-path shallow)) { git fetch --unshallow origin }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Integration candidate is behind or diverged from main; rebuild and retest.' }
          Write-Output 'UX 05 candidate contains current origin/main.'
          
      - name: Typecheck
        run: npm run typecheck

      - name: Electron 05B Library UX-01 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 106 || github.head_ref == 'integration/ux05-candidate-20261014') }}
        shell: pwsh
        timeout-minutes: 12
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot05b-native'
          New-Item -ItemType Directory -Force -Path $captures | Out-Null
          node scripts/check-contract-library-ui.cjs --output $captures --ux05b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath (Join-Path $captures 'controle-ui.json') -Raw | ConvertFrom-Json
          if ($report.errors.Count -ne 0 -or @($report.checks | Where-Object { -not $_.passed }).Count -ne 0) { throw '05B native recipe recorded an error' }
          "05B Electron native: $($report.checks.Count) checks, SQLite TEMP." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: UX-01 restore and quit roundtrip — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 unsaved input protection — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX 02E shell journeys coexistence — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-02e-journeys.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CRM 03B interaction coexistence — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'ux05-crm03b'
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot03b --captures $captures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CRM 03D client coexistence — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-03d-client.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CRM 03E directory coexistence — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux05-candidate-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-03e-directory.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests
        run: npm test -- --maxWorkers=2

      # PR109: native Windows smoke recipe on isolated TEMP profile and SQLite.
      # This is a real Electron shell run, not the full E226 unsaved-draft interaction recipe.
      - name: Electron 08A — real shell and operations navigation (TEMP)
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.number == 109 || github.head_ref == 'integration/ux-v2-lot08-109-115-convergence-20261014' || github.ref_name == 'feature/ux-v2-lot08c-maintenance-refresh-guard-20261014') }}
      - name: Lot 09F — Abby billing
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Expenses and receipts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Documents and archive
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Word DOCX and PDF work
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Global UX 3x3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09F — Restore and quit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09f-convergence-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Lot 09E — True Word DOCX and contract drafts Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot09e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09E — General UX Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09E — Restore and quit Windows TEMP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ux-v2-lot09e-word-drafts-20261014' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lot 09A draft PR: native Electron in isolated TEMP fixtures only.
      - name: Lot 09A — Electron UI and SQLite Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 113 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lot 09A — Restore and quit round-trip Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 113 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR98 standalone; the combined candidate runs this same recipe below.
      # La fixture crée exclusivement ses propres fichiers et profil dans %TEMP%.
      - name: Electron CRM 03B.6 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot08a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-ux-v2-lot01a-real-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lot 08 draft PR: native shell with real Electron/IPC and UX-01 regression.
      # Temporary fixtures only; no user profile, no Validation-MSI.
      - name: Electron Lot 08 — Shell and UX-01 Windows TEMP
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.head_ref == 'feature/ux-v2-lot08a-audit-v1' || github.head_ref == 'integration/ux-v2-lot08-109-115-convergence-20261014' || github.ref_name == 'feature/ux-v2-lot08c-maintenance-refresh-guard-20261014') }}
        shell: pwsh
        timeout-minutes: 20
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot08-shell-captures'
          node scripts/check-ux-v2-lot01a-real-ui.cjs --captures $captures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
