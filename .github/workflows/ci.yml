name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-coherence
      - feature/prospect-workflow-v2
  pull_request:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - feature/prospect-workflow-v2

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --maxWorkers=2

      # Recette 03B.6 sur le vrai Windows hébergé, limitée à la PR atelier.
      # La fixture crée exclusivement ses propres fichiers et profil dans %TEMP%.
      - name: Electron CRM 03B.6 — Windows TEMP (PR 98 only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot03b6-native-captures'
          $log = Join-Path $env:RUNNER_TEMP 'lot03b6-native.log'
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot03b --captures $captures 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Archive Electron 03B.6 evidence (PR 98 only)
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        uses: actions/upload-artifact@v4
        with:
          name: lot03b6-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lot03b6-native.log
            ${{ runner.temp }}/lot03b6-native-captures/*.png
          if-no-files-found: warn
          retention-days: 14
