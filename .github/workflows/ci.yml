name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-coherence
      - feature/prospect-workflow-v2
  pull_request:
    branches:
      - main
      - feature/ux-v2-lot04c-editor-drafts-v1
      - feature/ux-v2-lot04b-catalogue-navigation-v1
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - feature/prospect-workflow-v2

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Lot 04C: functional Electron editor checks, without visual-human signoff.
      - name: Electron Catalogue 04C — brouillons et conflits Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 108 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-identity-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Lot 04D/04E: cross-cutting Catalogue UI and UX-01 checks on Windows TEMP.
      - name: Electron Catalogue 04D-04E — Windows TEMP et 9 captures contrôlées
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot04-consolide-native-captures'
          if (Test-Path $captures) { throw "Capture directory already exists" }
          node scripts/check-catalog-identity-ui.cjs --captures $captures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $images = @(Get-ChildItem -LiteralPath $captures -Filter '*.png' -File)
          if ($images.Count -ne 9) { throw "Expected 9 verified visual states, got $($images.Count)" }
          foreach ($file in $images) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "LOT04 VERIFIED FRAME $($file.Name) sha256=$hash bytes=$($file.Length)"
          }

      - name: Electron Recommandations 04D — interactions et UX-01 Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-recommendations-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Electron Aide commerciale 04E — clavier, Escape, focus Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          node scripts/check-catalog-guidance-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Electron Devis 04D — conseil et achat explicite Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-quote-catalog-recommendations-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native 04D — Electron IPC et SQLite TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-catalog-recommendations-native.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 Catalogue 04D-04E — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 Restauration et fermeture Electron 04D-04E — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --maxWorkers=2

      - name: UX-01 — brouillons, confirmations et navigation (Windows TEMP)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 108 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-unsaved-inputs-ui.cjs --lot-b --lot-c --review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UX-01 — restauration et fermeture Electron (Windows TEMP)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 108 }}
        shell: pwsh
        timeout-minutes: 8
        run: |
          node scripts/check-restore-quit-roundtrip.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      # Lot 04B: real Electron renderer + mocked IPC, isolated under Windows TEMP.
      # This is deliberately scoped to the Catalogue pilot PR; no live workspace is opened.
      - name: Electron Catalogue 04B — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 104 }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot04b-electron-nine-modes'
          if (Test-Path $captures) { throw "Refusing to overwrite existing capture directory" }
          node scripts/check-catalog-identity-ui.cjs --captures $captures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $images = @(Get-ChildItem -LiteralPath $captures -Filter '*.png' -File)
          if ($images.Count -ne 9) { throw "Expected exactly 9 PNG, found $($images.Count)" }
          foreach ($file in $images) {
            $sha = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            Write-Output "LOT04B VERIFIED PNG $($file.Name) size=$($file.Length) sha256=$sha"
          }
          Write-Output "LOT04B RESULT 9/9 renderer frames captured in Windows TEMP; no database or live workspace touched"

      # PR98 standalone; the combined candidate runs this same recipe below.
      # La fixture crée exclusivement ses propres fichiers et profil dans %TEMP%.
      - name: Electron CRM 03B.6 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'lot03b6-native-captures'
          $log = Join-Path $env:RUNNER_TEMP 'lot03b6-native.log'
          node scripts/check-ux-v2-lot01a-real-ui.cjs --lot03b --captures $captures 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      # Stockage des artefacts saturé sur ce dépôt : conserver les preuves
      # textuelles et les empreintes dans les logs et le résumé GitHub.
      # Les PNG ne sont pas uploadés et la recette locale reste nécessaire
      # pour toute inspection visuelle humaine des captures.
      - name: Summarize Electron 03B.6 evidence
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.number == 98 }}
        shell: pwsh
        run: |
          $captureDir = Join-Path $env:RUNNER_TEMP 'lot03b6-native-captures'
          $captures = @(Get-ChildItem -LiteralPath $captureDir -Filter '*.png' -File | Sort-Object Name)
          if ($captures.Count -ne 9) { throw "Expected 9 PNG captures, found $($captures.Count)." }
          $log = Join-Path $env:RUNNER_TEMP 'lot03b6-native.log'
          $native = Get-Content -LiteralPath $log -Raw
          if ($native -notmatch 'PASSED ([0-9]+) real native assertions' -or $native -notmatch 'Fixture cleaned: true') {
            throw 'Native assertion summary or TEMP cleanup evidence missing.'
          }
          $checks = [regex]::Match($native, 'PASSED ([0-9]+) real native assertions').Groups[1].Value
          $lines = @(
            '## AtoumWeb 03B.6 — Real Windows/Electron recipe'
            ''
            '- True App + preload + IPC + SQLite TEMP'
            "- $checks native assertions passed; temporary fixture cleaned"
            '- 9 compositor-verified captures, 3 themes × 3 densities'
            '- Images are not uploaded: the Actions artifact storage quota is full'
            '- Manual visual inspection requires a local Windows run'
            ''
            '| Capture | SHA-256 |'
            '| --- | --- |'
          )
          foreach ($capture in $captures) {
            $sha = (Get-FileHash -LiteralPath $capture.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "| $($capture.Name) | $sha |"
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Write-Output

      - name: Electron combined 02C 02D 02E CRM and UX-01 — Windows TEMP
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'integration/ux-v2-02e-03c-v1' }}
        shell: pwsh
        run: |
          node scripts/check-ux-v2-integration-validate.cjs --native-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
