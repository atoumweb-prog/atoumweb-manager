name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - fix/recette-commerciale-coherence
      - feature/prospect-workflow-v2
  pull_request:
    branches:
      - main
      - foundation/electron-react-sqlite
      - feature/phase-1-crm
      - feature/phase-2-commercial
      - feature/phase-3-projects
      - feature/phase-4-operations
      - feature/prospect-workflow-v2

jobs:
  quality:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
