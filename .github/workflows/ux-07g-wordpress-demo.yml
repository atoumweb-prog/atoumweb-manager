name: UX 07G WordPress Bridge Demo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ux07g-wordpress:
    if: ${{ github.head_ref == 'integration/ux-v2-07a-07b-navigation-validation' || github.ref_name == 'integration/ux-v2-07a-07b-navigation-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Manager fixture and contract
        uses: actions/checkout@v4
      - name: Checkout public Bridge 0.8.4 candidate
        uses: actions/checkout@v4
        with:
          repository: atoumweb-prog/atoumweb-bridge
          ref: feature/workbench-occurrence-v1
          path: bridge-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fixture dependencies
        run: npm ci
      - name: Generate a real Manager Page V2 package and controlled exportId collision
        run: |
          node scripts/generate-ux07g-page-package.cjs "$GITHUB_WORKSPACE/bridge-plugin/tests"
          cp scripts/fixtures/ux07g-bridge-workbench.php bridge-plugin/tests/ux07g-bridge-workbench.php
          printf '%s\n' '{"plugins":["./bridge-plugin"]}' > .wp-env.json
      - name: Install isolated WordPress test runtime
        timeout-minutes: 20
        run: |
          npm install --no-save --no-package-lock @wordpress/env
          npx wp-env start
      - name: R07G-23/24 real WordPress draft, idempotence and collision gate
        timeout-minutes: 8
        run: |
          npx wp-env run cli wp plugin activate bridge-plugin
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/bridge-plugin/tests/ux07g-bridge-workbench.php
      - name: Stop disposable WordPress
        if: always()
        continue-on-error: true
        run: |
          if test -x node_modules/.bin/wp-env; then npx wp-env stop; fi
